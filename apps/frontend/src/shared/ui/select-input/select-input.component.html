<label class="ui-field" [for]="inputId">
  <span class="ui-field__label">
    {{ label }}
    @if (required) {
      <span class="ui-field__required" aria-hidden="true">*</span>
    }
  </span>
  <select
    class="ui-field__control"
    [id]="inputId"
    [name]="name"
    [required]="required"
    [disabled]="isDisabled"
    [value]="value"
    [attr.aria-invalid]="hasError ? 'true' : null"
    [attr.aria-describedby]="describedBy"
    [attr.aria-readonly]="readonly ? 'true' : null"
    (change)="handleChange($event)"
    (keydown)="handleReadonlyKeydown($event)"
    (blur)="handleBlur()"
  >
    @if (placeholder) {
      <option value="" disabled>{{ placeholder }}</option>
    }
    @for (option of options; track option.value) {
      <option [value]="option.value">{{ option.label }}</option>
    }
  </select>
  @if (helpText) {
    <span class="ui-field__help" [id]="helpId">{{ helpText }}</span>
  }
  @if (errorText) {
    <span class="ui-field__error" [id]="errorId">{{ errorText }}</span>
  }
</label>
