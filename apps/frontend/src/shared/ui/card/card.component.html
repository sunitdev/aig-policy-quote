<article
  class="ui-card"
  [class.ui-card--default]="variant === 'default'"
  [class.ui-card--subtle]="variant === 'subtle'"
  [class.ui-card--elevated]="variant === 'elevated'"
>
  <header class="ui-card__header">
    <ng-content select="[appCardHeader]" />
  </header>
  <div class="ui-card__body">
    <ng-content />
  </div>
  <footer class="ui-card__footer">
    <ng-content select="[appCardFooter]" />
  </footer>
</article>
